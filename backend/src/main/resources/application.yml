spring:
  application:
    name: tradox
  profiles:
    active: dev

server:
  port: 8080

---
# Default / shared config
spring:
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# Application Security Configuration
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000  # 24 hours
  encryption:
    secret-key: ${ENCRYPTION_SECRET}
